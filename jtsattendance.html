<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JTS Attendance</title>
<link rel="stylesheet" href="styles.css">
<style>
.jts-page{max-width:1180px;margin:0 auto;padding:28px}.jts-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding:24px 0;border-bottom:1px solid var(--line)}.jts-head p{color:var(--muted);margin-top:6px}.jts-controls{display:flex;gap:10px;flex-wrap:wrap}.jts-controls input{min-width:240px}.jts-search-results{display:grid;gap:8px;margin-top:14px}.worker-result{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:rgba(50,166,115,.1);color:var(--ink);cursor:pointer;text-align:left}.worker-result span{display:flex;flex-direction:column;gap:4px}.worker-result small{color:var(--muted)}.marked{margin-top:20px}.marked h2{font-size:18px}.jts-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.marked table{min-width:700px}@media(max-width:700px){.jts-page{padding:14px}.jts-head{display:block}.jts-head h1{font-size:24px;margin-bottom:16px}.jts-controls{display:grid;grid-template-columns:1fr}.jts-controls input{min-width:0;width:100%}}
</style>
</head>
<body>
<main class="jts-page">
<header class="jts-head"><div><h1>JTS Attendance</h1><p>Supervisor attendance portal · attendance only</p></div><div class="jts-controls"><input id="attendanceDate" type="date"><a class="secondary" href="index.html">Admin system</a></div></header>
<section class="section" style="margin-top:20px"><div style="padding:18px 20px"><p class="muted">Search by worker name, ID, or staff number. Only name and ID are shown.</p><div class="jts-controls" style="margin-top:14px"><input id="workerSearch" type="search" placeholder="Search worker name or ID" autocomplete="off"></div><div id="searchResults" class="jts-search-results"></div></div><div id="summary" class="jts-summary"></div></section>
<section class="section marked"><div style="padding:18px 20px"><h2>Marked attendance</h2><div class="jts-actions"><button class="secondary" id="editSelected">Edit selected</button><button class="secondary" id="cancelSelected">Cancel selected</button><button class="primary" id="submitFinal">Submit final copy</button></div><div class="table-container"><table><thead><tr><th>Select</th><th>Worker</th><th>ID</th><th>Status</th><th>Hours</th><th>OT</th><th>Action</th></tr></thead><tbody id="markedTable"></tbody></table></div></div></section>
</main><div class="toast" id="toast"></div>
<script src="vendor/supabase.min.js"></script><script src="config.js"></script><script src="data.js"></script><script src="jtsattendance.js"></script><script src="supabase.js?v=20260829080000"></script>
</body></html>
